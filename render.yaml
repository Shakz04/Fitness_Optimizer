services:
  - type: web
    name: fitness-optimizer
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:deploy && npm run prisma:seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fitness-optimizer-db
          property: connectionString

databases:
  - name: fitness-optimizer-db
    plan: free
    databaseName: fitness_optimizer
    user: fitness_optimizer
